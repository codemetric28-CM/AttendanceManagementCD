services:
  # ──────────────────────────────────────────────
  # Backend – Node / Express API
  # ──────────────────────────────────────────────
  - type: web
    name: attendx-api
    runtime: node
    region: singapore          # change to your preferred region
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # Render injects $PORT; this is just a default
      - key: MONGO_URI
        sync: false             # set this secret in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false             # set this secret in Render dashboard
      - key: CLIENT_URL
        sync: false             # set to your Static Site URL after first deploy

  # ──────────────────────────────────────────────
  # Frontend – React / Vite Static Site
  # ──────────────────────────────────────────────
  - type: static
    name: attendx-client
    runtime: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback for React Router
    envVars:
      - key: VITE_API_URL
        sync: false               # optional – set to your API URL if needed
